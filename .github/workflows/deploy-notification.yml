name: Notification Discord

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le message
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content": "🚀 **Le site CryptoDigest est à jour !**\nDe nouvelles informations sont en ligne.\n\n🔗 [Cliquez ici pour voir le site](https://cryptodigest-ruby.vercel.app/)"}' \
          "${{ secrets.DISCORD_WEBHOOK }}"